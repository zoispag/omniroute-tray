version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # codeql.yml tracks the floating `v4` major tag on purpose. Without this,
      # Dependabot reads `@v4` as version 4 and keeps proposing an exact pin to
      # the latest 4.x (see #36), which downgrades as soon as it goes stale.
      - dependency-name: github/codeql-action
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
